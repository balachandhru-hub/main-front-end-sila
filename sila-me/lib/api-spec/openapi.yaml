components:
  parameters:
    CustomerIdQuery:
      name: customerId
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
    PropertyIdQuery:
      name: propertyId
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
    StoreIdQuery:
      name: storeId
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
    IntegerId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: integer }
  responses:
    AuthenticationRequired:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    AccessDenied:
      description: Insufficient role or organization scope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    OperationalSurfaceResponse:
      type: object
      required: [surface, scope, records]
      properties:
        surface: { type: string }
        scope:
          type: object
          required: [customerIds, propertyIds, storeIds]
          properties:
            customerIds:
              type: array
              items: { type: integer }
            propertyIds:
              type: array
              items: { type: integer }
            storeIds:
              type: array
              items: { type: integer }
        records:
          type: array
          items:
            type: object
            additionalProperties: true
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    ServiceHealth:
      type: object
      properties:
        status: { type: string, enum: [OK, DEGRADED] }
        database: { type: string, enum: [CONNECTED, UNAVAILABLE] }
      required: [status, database]
    VersionInfo:
      type: object
      properties:
        service: { type: string }
        version: { type: string }
      required: [service, version]
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
      required: [error]
    SignInInput:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
      required: [email, password]
    MobileUser:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
      required: [id, name, email]
    MobileLoginResult:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer }
        mustChangePassword: { type: boolean }
        user: { $ref: "#/components/schemas/MobileUser" }
      required: [accessToken, tokenType, expiresIn, mustChangePassword, user]
    ChangePasswordInput:
      type: object
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 12 }
      required: [currentPassword, newPassword]
    User:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        authProvider: { type: string }
        role: { type: string }
        customerScope: { type: string }
        propertyScope: { type: string }
        storeScope: { type: string }
        scope: { type: string }
        lastLoginAt: { type: ["string", "null"], format: date-time }
        status: { type: string }
        mustChangePassword: { type: boolean }
        sharePointLink:
          oneOf:
            - $ref: "#/components/schemas/SharePointUserLink"
            - type: "null"
      required: [id, code, email, name, authProvider, role, customerScope, propertyScope, storeScope, scope, lastLoginAt, status, mustChangePassword, sharePointLink]
    AdministrationUserBase:
      type: object
      properties:
        id: { type: integer }
        legacyUserId: { type: integer }
        email: { type: string, format: email }
        displayName: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DEACTIVATED] }
        roleCodes:
          type: array
          items: { type: string }
        mustChangePassword: { type: boolean }
        lastLoginAt: { type: ["string", "null"], format: date-time }
        notificationStatus: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, legacyUserId, email, displayName, status, roleCodes, mustChangePassword, lastLoginAt, notificationStatus, createdAt]
    MobileAdministrationUser:
      allOf:
        - $ref: "#/components/schemas/AdministrationUserBase"
        - type: object
          properties:
            code: { type: string }
            customer:
              oneOf:
                - $ref: "#/components/schemas/Customer"
                - type: "null"
            propertyIds:
              type: array
              items: { type: integer }
            storeIds:
              type: array
              items: { type: integer }
          required: [code, customer, propertyIds, storeIds]
    CloudAdministrationUser:
      $ref: "#/components/schemas/AdministrationUserBase"
    MobileAdministrationUserCreated:
      allOf:
        - $ref: "#/components/schemas/MobileAdministrationUser"
        - $ref: "#/components/schemas/NotificationResult"
    CloudAdministrationUserCreated:
      allOf:
        - $ref: "#/components/schemas/CloudAdministrationUser"
        - $ref: "#/components/schemas/NotificationResult"
    MobileAdministrationUserInput:
      type: object
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1 }
        roleCodes: { type: array, minItems: 1, items: { type: string } }
        customerId: { type: integer }
        propertyIds: { type: array, minItems: 1, items: { type: integer } }
        storeIds: { type: array, minItems: 1, items: { type: integer } }
        temporaryPassword: { type: string, minLength: 12 }
      required: [email, displayName, roleCodes, customerId, propertyIds, storeIds]
    MobileAdministrationUserUpdate:
      type: object
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1 }
        roleCodes: { type: array, minItems: 1, items: { type: string } }
        customerId: { type: integer }
        propertyIds: { type: array, minItems: 1, items: { type: integer } }
        storeIds: { type: array, minItems: 1, items: { type: integer } }
        temporaryPassword: { type: string, minLength: 12 }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DEACTIVATED] }
    CloudAdministrationUserInput:
      type: object
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1 }
        roleCodes: { type: array, minItems: 1, items: { type: string } }
        temporaryPassword: { type: string, minLength: 12 }
      required: [email, displayName, roleCodes]
    CloudAdministrationUserUpdate:
      type: object
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1 }
        roleCodes: { type: array, minItems: 1, items: { type: string } }
        temporaryPassword: { type: string, minLength: 12 }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DEACTIVATED] }
    NotificationResult:
      type: object
      properties:
        notification:
          type: object
          properties:
            status: { type: string, enum: [SENT, NOT_CONFIGURED, FAILED] }
            deliveryId: { type: integer }
          required: [status, deliveryId]
      required: [notification]
    AuthSession:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        allowedRoutes:
          type: array
          items: { type: string }
      required: [user, allowedRoutes]
    UserInput:
      type: object
      properties:
        code: { type: string, minLength: 2 }
        email: { type: string, format: email }
        name: { type: string, minLength: 1 }
        authProvider: { type: string }
        role: { type: string }
        customerScope: { type: string }
        propertyScope: { type: string }
        storeScope: { type: string }
        password: { type: string, minLength: 1 }
        sharePointSiteUrl: { type: ["string", "null"], format: uri }
        sharePointFolderPath: { type: ["string", "null"], minLength: 1 }
        sharePointFolderUrl: { type: ["string", "null"], format: uri }
      required: [code, email, name, role, customerScope, propertyScope, storeScope, password]
    UserUpdate:
      type: object
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 1 }
        authProvider: { type: string }
        role: { type: string }
        customerScope: { type: string }
        propertyScope: { type: string }
        storeScope: { type: string }
        password: { type: string, minLength: 1 }
        status: { type: string }
        sharePointSiteUrl: { type: ["string", "null"], format: uri }
        sharePointFolderPath: { type: ["string", "null"], minLength: 1 }
        sharePointFolderUrl: { type: ["string", "null"], format: uri }
      minProperties: 1
    SharePointUserLink:
      type: object
      properties:
        siteUrl: { type: string, format: uri }
        folderPath: { type: string }
        folderUrl: { type: ["string", "null"], format: uri }
        status: { type: string, enum: [Configured, PendingVerification, AccessDenied] }
        verificationMessage: { type: ["string", "null"] }
        lastVerifiedAt: { type: ["string", "null"], format: date-time }
      required: [siteUrl, folderPath, folderUrl, status, verificationMessage, lastVerifiedAt]
    Customer:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        status: { type: string }
      required: [id, code, name, status]
    Property:
      type: object
      properties:
        id: { type: integer }
        customerId: { type: integer }
        code: { type: string }
        name: { type: string }
        status: { type: string }
      required: [id, customerId, code, name, status]
    Store:
      type: object
      properties:
        id: { type: integer }
        propertyId: { type: integer }
        code: { type: string }
        name: { type: string }
        status: { type: string }
      required: [id, propertyId, code, name, status]
    CustomerInput:
      type: object
      properties:
        code: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        status: { type: string, enum: [Active, Inactive] }
      required: [code, name]
    CustomerUpdate:
      type: object
      properties:
        code: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        status: { type: string, enum: [Active, Inactive] }
      minProperties: 1
    PropertyInput:
      type: object
      properties:
        customerId: { type: integer }
        code: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        status: { type: string, enum: [Active, Inactive] }
      required: [customerId, code, name]
    PropertyUpdate:
      type: object
      properties:
        customerId: { type: integer }
        code: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        status: { type: string, enum: [Active, Inactive] }
      minProperties: 1
    StoreInput:
      type: object

openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: SILA Cloud shared backend API
servers:
  - url: /api
    description: Base API path
tags:
  - { name: health, description: Health and version operations }
  - { name: authentication, description: Web and mobile authentication }
  - { name: users, description: Existing Cloud user administration }
  - { name: administration, description: Shared organization and access administration }
  - { name: mobile, description: SILA Store mobile configuration }
  - { name: ocr, description: Cloud-managed invoice OCR agent configuration }
  - { name: invoices, description: "Mobile invoice capture, review, and history" }
  - { name: master-data, description: Tenant-scoped material and supplier master data }
  - { name: operational, description: Tenant-scoped operational dashboard reads }
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Compatibility health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /health:
    get:
      operationId: serviceHealth
      tags: [health]
      summary: Check API and database health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceHealth" }
        "503":
          description: Database unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceHealth" }
  /version:
    get:
      operationId: getVersion
      tags: [health]
      summary: Return backend service version
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }
  /auth/sign-in:
    post:
      operationId: signIn
      tags: [authentication]
      summary: Resolve a user role and create a browser session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInInput" }
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401":
          description: Invalid or suspended credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /auth/mobile/login:
    post:
      operationId: mobileLogin
      tags: [authentication]
      summary: Exchange local credentials for a mobile bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInInput" }
      responses:
        "200":
          description: Mobile access token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileLoginResult" }
        "401":
          description: Invalid or suspended credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /auth/session:
    get:
      operationId: getSession
      tags: [authentication]
      summary: Return the current browser session
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /auth/sign-out:
    post:
      operationId: signOut
      tags: [authentication]
      summary: End the current browser session
      responses:
        "204": { description: Session ended }
  /me:
    get:
      operationId: getMe
      tags: [authentication]
      summary: Return the current normalized identity and scope
      responses:
        "200":
          description: Current identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResult" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users visible to the authenticated Cloud operator
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Insufficient permission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user with a supported role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: Invalid user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Insufficient permission or scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Duplicate user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Edit a user, role, status, or legacy scope
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: Invalid user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Insufficient permission or scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: User not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Duplicate user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/mobile-users:
    get:
      operationId: listMobileUsers
      tags: [administration]
      summary: List mobile users in the caller organization scope
      responses:
        "200":
          description: Mobile users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MobileAdministrationUser" }
    post:
      operationId: createMobileUser
      tags: [administration]
      summary: Create a mobile user with explicit organization access
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MobileAdministrationUserInput" }
      responses:
        "201":
          description: Mobile user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileAdministrationUserCreated" }
  /admin/mobile-users/{id}:
    patch:
      operationId: updateMobileUser
      tags: [administration]
      summary: Update mobile user identity, role, access, or status
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MobileAdministrationUserUpdate" }
      responses:
        "200":
          description: Mobile user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileAdministrationUser" }
  /admin/cloud-users:
    get:
      operationId: listCloudUsers
      tags: [administration]
      summary: List Cloud users
      responses:
        "200":
          description: Cloud users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CloudAdministrationUser" }
    post:
      operationId: createCloudUser
      tags: [administration]
      summary: Create a Cloud user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudAdministrationUserInput" }
      responses:
        "201":
          description: Cloud user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudAdministrationUserCreated" }
  /admin/cloud-users/{id}:
    patch:
      operationId: updateCloudUser
      tags: [administration]
      summary: Update Cloud user identity, role, or status
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloudAdministrationUserUpdate" }
      responses:
        "200":
          description: Cloud user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudAdministrationUser" }
  /admin/{domain}-users/{id}/reset-password:
    post:
      operationId: resetAdministrationUserPassword
      tags: [administration]
      summary: Generate a temporary password and notify an administration user
      parameters:
        - name: domain
          in: path
          required: true
          schema: { type: string, enum: [mobile, cloud] }
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Notification result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationResult" }
  /admin/{domain}-users/{id}/resend-credentials:
    post:
      operationId: resendAdministrationUserCredentials
      tags: [administration]
      summary: Generate and resend new credentials
      parameters:
        - name: domain
          in: path
          required: true
          schema: { type: string, enum: [mobile, cloud] }
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Notification result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationResult" }
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [authentication]
      summary: Change the current domain user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties: { changed: { type: boolean } }
                required: [changed]
  /admin/customers:
    get:
      operationId: listCustomers
      tags: [administration]
      summary: List customers in the caller scope
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Customer" }
    post:
      operationId: createCustomer
      tags: [administration]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerInput" }
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "409":
          description: Duplicate customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/customers/{id}:
    put:
      operationId: updateCustomer
      tags: [administration]
      summary: Update a customer
      parameters:
        - $ref: "#/components/parameters/IntegerId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerUpdate" }
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "404":
          description: Customer not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/properties:
    get:
      operationId: listProperties
      tags: [administration]
      summary: List properties in the caller scope
      responses:
        "200":
          description: Properties
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Property" }
    post:
      operationId: createProperty
      tags: [administration]
      summary: Create a property
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyInput" }
      responses:
        "201":
          description: Created property
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Property" }
        "409":
          description: Duplicate property
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/properties/{id}:
    put:
      operationId: updateProperty
      tags: [administration]
      summary: Update a property
      parameters:
        - $ref: "#/components/parameters/IntegerId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyUpdate" }
      responses:
        "200":
          description: Updated property
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Property" }
        "404":
          description: Property not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/stores:
    get:
      operationId: listStores
      tags: [administration]
      summary: List stores in the caller scope
      responses:
        "200":
          description: Stores
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Store" }
    post:
      operationId: createStore
      tags: [administration]
      summary: Create a store
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreInput" }
      responses:
        "201":
          description: Created store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        "409":
          description: Duplicate store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/stores/{id}:
    put:
      operationId: updateStore
      tags: [administration]
      summary: Update a store
      parameters:
        - $ref: "#/components/parameters/IntegerId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreUpdate" }
      responses:
        "200":
          description: Updated store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        "404":
          description: Store not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/roles:
    get:
      operationId: listRoles
      tags: [administration]
      summary: List assignable roles
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Role" }
  /admin/permissions:
    get:
      operationId: listPermissions
      tags: [administration]
      summary: List permissions
      responses:
        "200":
          description: Permissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Permission" }
  /admin/users/{id}/roles:
    put:
      operationId: assignUserRoles
      tags: [administration]
      summary: Replace a user's role assignments
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserRoleAssignment" }
      responses:
        "200":
          description: Assigned roles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAccessResult" }
        "404":
          description: User or role not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/users/{id}/access:
    put:
      operationId: assignUserAccess
      tags: [administration]
      summary: Replace a user's customer, property, and store access
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserAccessAssignment" }
      responses:
        "200":
          description: Assigned access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAccessResult" }
        "404":
          description: User or scope resource not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Invalid hierarchy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/mobile-config:
    put:
      operationId: updateMobileConfiguration
      tags: [administration]
      summary: Create or update mobile feature configuration for a scope
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MobileConfigurationInput" }
      responses:
        "200":
          description: Effective stored configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileConfiguration" }
        "422":
          description: Invalid hierarchy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/ocr-agent:
    get:
      operationId: listOcrAgentConfigurations
      tags: [ocr]
      summary: List configured invoice OCR agents
      responses:
        "200":
          description: OCR agent configurations visible to the operator
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OcrAgentConfiguration" }
        "403":
          description: Configuration permission required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      operationId: updateOcrAgentConfiguration
      tags: [ocr]
      summary: Link or disable a customer invoice OCR agent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OcrAgentConfigurationInput" }
      responses:
        "200":
          description: Saved OCR agent configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OcrAgentConfiguration" }
        "400":
          description: Invalid OCR agent configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Configuration permission or customer scope denied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /mobile/config:
    get:
      operationId: getMobileConfig
      tags: [mobile]
      summary: Return effective mobile features for the authenticated scope
      responses:
        "200":
          description: Effective configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileConfiguration" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: No customer scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /documents/invoices:
    post:
      operationId: uploadInvoiceDocument
      tags: [invoices]
      summary: Upload an invoice document for server-side processing
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/InvoiceUploadInput" }
      responses:
        "201":
          description: Invoice document captured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceUploadResponse" }
        "400":
          description: Invalid upload or missing idempotency key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Scope, permission, or feature flag denied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "413":
          description: File exceeds the configured upload limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "415":
          description: Unsupported invoice file type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: SharePoint upload failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /invoices/history:
    get:
      operationId: listInvoiceHistory
      tags: [invoices]
      summary: List invoice documents visible to the authenticated user
      responses:
        "200":
          description: Invoice history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceHistoryResponse" }
  /invoices/{invoiceId}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Return an invoice and its extracted lines
      parameters:
        - { name: invoiceId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Invoice detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceDetailResponse" }
        "404":
          description: Invoice not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      operationId: reviewInvoice
      tags: [invoices]
      summary: Save reviewed or corrected invoice extraction
      parameters:
        - { name: invoiceId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceReviewInput" }
      responses:
        "200":
          description: Invoice review saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceStatusResponse" }
        "404":
          description: Invoice not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /invoices/{invoiceId}/confirm:
    post:
      operationId: confirmInvoice
      tags: [invoices]
      summary: Confirm reviewed invoice data
      parameters:
        - { name: invoiceId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Invoice confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceStatusResponse" }
        "404":
          description: Invoice not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /materials/search:
    get:
      operationId: searchMaterials
      tags: [master-data]
      summary: Search authorized active materials
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: barcode, in: query, schema: { type: string } }
        - { name: plantCode, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 0, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Material search results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialSearchResponse" }
        "403":
          description: Insufficient permission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /materials/by-code/{code}:
    get:
      operationId: getMaterialByCode
      tags: [master-data]
      summary: Resolve an authorized material code
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Material detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialDetail" }
        "404":
          description: Material not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Code is ambiguous without a plant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /materials/recognize:
    get:
      operationId: recognizeMaterial
      tags: [master-data]
      summary: Deterministically recognize a material from supplied clues
      parameters:
        - { name: barcode, in: query, schema: { type: string } }
        - { name: materialCode, in: query, schema: { type: string } }
        - { name: supplierMaterialCode, in: query, schema: { type: string } }
        - { name: description, in: query, schema: { type: string } }
        - { name: alias, in: query, schema: { type: string } }
        - { name: brand, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
      responses:
        "200":
          description: Deterministic recognition result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialRecognitionResponse" }
  /materials/confirm:
    post:
      operationId: confirmMaterial
      tags: [master-data]
